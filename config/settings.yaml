# Configuración global del modelo de detección de basurales
model:
  architecture: "resnet18"
  window_size: 480
  num_classes: 2

training:
  batch_size: 4
  lr: 0.01
  n_epochs: 15
  mixed_precision: false

classes:
  names: ["background", "basural"]
  colors: ["lightgray", "darkred"]
  null_class: "background"

inference:
  confidence_threshold: 0.5